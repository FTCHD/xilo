[[command]]
id = "live_reporting"
msg = "0057"
label = "Realtime trigger"
group = "hidden"
input = "none"
fixed = [{ key = "a2", kind = "u8", value = 1 }, { key = "a3", kind = "u32", value = 60 }]

[[command]]
id = "charger_mode_select"
msg = "0103"
label = "Charger mode select"
group = "function"
param = { key = "a2", kind = "u8" }
input = "choice"
options = [{ value = 0, label = "Normal" }, { value = 1, label = "Reverse" }]
state = "charger_mode"

[[command]]
id = "device_switch"
msg = "0103"
label = "Device switch"
group = "function"
param = { key = "ac", kind = "u8" }
input = "switch"
on_value = 1
off_value = 0
on_state = 1
state = "device_switch"

[[command]]
id = "temperature_unit"
msg = "0103"
label = "Temperature unit switch"
group = "general"
param = { key = "b2", kind = "u8" }
input = "choice"
options = [{ value = 0, label = "Celsius" }, { value = 1, label = "Fahrenheit" }]
state = "temperature_unit"

[[command]]
id = "device_power_mode"
msg = "0103"
label = "Device power mode"
group = "hidden"
input = "none"
fixed = [{ key = "b8", kind = "u8", value = 1 }]

