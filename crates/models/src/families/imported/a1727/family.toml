[[command]]
id = "dc_output_timeout_seconds"
msg = "0043"
label = "DC output timeout seconds"
group = "function"
param = { key = "a2", kind = "u32" }
input = "number"
min = 0
max = 86100
step = 300
unit = "s"
state = "dc_output_timeout_seconds"

[[command]]
id = "device_timeout"
msg = "0045"
label = "Device timeout minutes"
group = "function"
param = { key = "a2", kind = "u16" }
input = "choice"
options = [{ value = 0, label = "0 min" }, { value = 30, label = "30 min" }, { value = 60, label = "60 min" }, { value = 120, label = "120 min" }, { value = 240, label = "240 min" }, { value = 360, label = "360 min" }, { value = 720, label = "720 min" }, { value = 1440, label = "1440 min" }]
state = "device_timeout"

[[command]]
id = "screen_timeout"
msg = "0046"
label = "Display timeout seconds"
group = "function"
param = { key = "a2", kind = "u16" }
input = "choice"
options = [{ value = 20, label = "20 s" }, { value = 30, label = "30 s" }, { value = 60, label = "60 s" }, { value = 300, label = "300 s" }, { value = 1800, label = "1800 s" }]
state = "screen_timeout"

[[command]]
id = "display_mode_select"
msg = "004c"
label = "Display mode select"
group = "function"
param = { key = "a2", kind = "u8" }
input = "choice"
options = [{ value = 3, label = "High" }, { value = 1, label = "Low" }, { value = 2, label = "Medium" }]
state = "screen_brightness"

[[command]]
id = "temperature_unit"
msg = "0050"
label = "Temperature unit switch"
group = "general"
param = { key = "a2", kind = "u8" }
input = "choice"
options = [{ value = 0, label = "Celsius" }, { value = 1, label = "Fahrenheit" }]
state = "temperature_unit"

[[command]]
id = "screen_switch"
msg = "0052"
label = "Display switch"
group = "control"
param = { key = "a2", kind = "u8" }
input = "switch"
on_value = 1
off_value = 0
on_state = 1
state = "screen_on"

[[command]]
id = "live_reporting"
msg = "0057"
label = "Realtime trigger"
group = "hidden"
input = "none"
fixed = [{ key = "a2", kind = "u8", value = 1 }, { key = "a3", kind = "u32", value = 60 }]

