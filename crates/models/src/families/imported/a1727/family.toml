# Generated by `cargo xtask import solix-api` from anker-solix-api (MIT). Curate by hand.
[family]
id = "imp_a1727"
protocol = "zx"
gatt = "g1"
state_msgs = ["0401", "0405", "0830"]
keepalive = { command = "live_reporting", every_s = 60 }

