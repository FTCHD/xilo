[[command]]
id = "ac_output_timer"
msg = "0101"
label = "AC Output Timer"
group = "function"
param = { key = "a3", kind = "u32" }
input = "number"
min = 0
max = 86400
step = 300
unit = "s"
state = "ac_output_timer_seconds"

[[command]]
id = "ac_charge_power"
msg = "0101"
label = "AC Recharging Power"
group = "function"
param = { key = "a4", kind = "u16" }
input = "number"
min = 100
max = 1200
step = 100
unit = "W"
state = "ac_charge_power"

[[command]]
id = "ultrafast"
msg = "0101"
label = "UltraFast Charging"
group = "control"
param = { key = "a7", kind = "u8" }
input = "switch"
on_value = 1
off_value = 0
on_state = 1
state = "ac_fast_charge_switch"

[[command]]
id = "ac_output_timeout_minutes"
msg = "0101"
label = "AC Output Timeout"
group = "function"
param = { key = "aa", kind = "u16" }
input = "choice"
options = [{ value = 0, label = "0 min" }, { value = 15, label = "15 min" }, { value = 30, label = "30 min" }, { value = 60, label = "60 min" }, { value = 120, label = "120 min" }, { value = 240, label = "240 min" }, { value = 360, label = "360 min" }, { value = 480, label = "480 min" }, { value = 600, label = "600 min" }, { value = 720, label = "720 min" }, { value = 1440, label = "1440 min" }]
state = "ac_output_timeout_minutes"

[[command]]
id = "screen_switch"
msg = "0103"
label = "Screen"
group = "control"
param = { key = "a2", kind = "u8" }
input = "switch"
on_value = 1
off_value = 0
on_state = 1
state = "screen_on"

[[command]]
id = "screen_brightness"
msg = "0103"
label = "Screen Brightness"
group = "function"
param = { key = "a3", kind = "u8" }
input = "choice"
options = [{ value = 3, label = "High" }, { value = 1, label = "Low" }, { value = 2, label = "Medium" }]
state = "screen_brightness"

[[command]]
id = "screen_timeout"
msg = "0103"
label = "Screen Timeout"
group = "function"
param = { key = "a4", kind = "u16" }
input = "choice"
options = [{ value = 10, label = "10 s" }, { value = 20, label = "20 s" }, { value = 30, label = "30 s" }, { value = 60, label = "60 s" }, { value = 300, label = "300 s" }, { value = 1800, label = "1800 s" }]
state = "screen_timeout"

[[command]]
id = "temperature_unit"
msg = "0103"
label = "Temperature Unit"
group = "general"
param = { key = "a5", kind = "u8" }
input = "choice"
options = [{ value = 0, label = "Celsius" }, { value = 1, label = "Fahrenheit" }]
state = "temperature_unit"

[[command]]
id = "device_timeout"
msg = "0103"
label = "Device Timeout"
group = "function"
param = { key = "a6", kind = "u16" }
input = "choice"
options = [{ value = 0, label = "0 min" }, { value = 30, label = "30 min" }, { value = 60, label = "60 min" }, { value = 120, label = "120 min" }, { value = 240, label = "240 min" }, { value = 360, label = "360 min" }, { value = 720, label = "720 min" }, { value = 1440, label = "1440 min" }]
state = "device_timeout"

[[command]]
id = "port_memory_switch"
msg = "0103"
label = "Output Port Memory"
group = "function"
param = { key = "a8", kind = "u8" }
input = "switch"
on_value = 1
off_value = 0
on_state = 1
state = "port_memory_switch"

