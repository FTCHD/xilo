# From SolixBLE (MIT, Harvey Lelliott): SolixBLE/devices/prime_*.py and maggo_3in1.py.
[family]
id = "prime_a2345"
protocol = "prime"
gatt = "g1"
state_msgs = ["0300", "0a00"]

[[field]]
key = "a2"
id = "usb_c1_state"
label = "USB-C1"
kind = "u8"
offset = 0
enum = { "0" = "Off", "1" = "Output", "2" = "Input" }

[[field]]
key = "a2"
id = "usb_c1_voltage"
label = "USB-C1 voltage"
kind = "u16"
offset = 1
scale = 0.001
unit = "V"

[[field]]
key = "a2"
id = "usb_c1_current"
label = "USB-C1 current"
kind = "u16"
offset = 3
scale = 0.001
unit = "A"

[[field]]
key = "a2"
id = "usb_c1_power"
label = "USB-C1 power"
kind = "u16"
offset = 5
scale = 0.01
unit = "W"

