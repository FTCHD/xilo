label = "USB-C1 state"
kind = "u8"
enum = { "0" = "Off", "1" = "Output" }

[[field]]
key = "c7"
id = "usb_c2_state"
label = "USB-C2 state"
kind = "u8"
enum = { "0" = "Off", "1" = "Output" }

[[field]]
key = "c8"
