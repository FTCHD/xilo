[family]
id = "c1000"
protocol = "zx"
gatt = "g1"
state_msgs = ["0840", "0405", "0402"]
status_request = "status"
keepalive = { command = "live_reporting", every_s = 60 }
poll = { command = "status", every_s = 60 }
dashboard = "c1000"

[[field]]
key = "a2"
id = "ac_timer_remaining"
label = "AC timer remaining"
kind = "u32"
unit = "s"

[[field]]
key = "a3"
id = "dc_timer_remaining"
label = "Car timer remaining"
kind = "u32"
unit = "s"

[[field]]
key = "a4"
id = "remaining_time"
label = "Remaining time"
kind = "u16"
scale = 0.1
unit = "h"
na = 65535

[[field]]
key = "a5"
id = "ac_input_power"
label = "AC input"
kind = "u16"
unit = "W"

[[field]]
key = "a6"
id = "ac_output_power"
label = "AC output"
kind = "u16"
unit = "W"

[[field]]
key = "a7"
id = "usb_c1_power"
label = "USB-C1"
kind = "u16"
unit = "W"

[[field]]
