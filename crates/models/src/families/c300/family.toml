[[command]]
id = "status"
msg = "0040"
label = "Read status"
input = "none"

[[command]]
id = "live_reporting"
msg = "0057"
label = "Live reporting"
input = "none"
fixed = [{ key = "a2", kind = "u8", value = 1 }, { key = "a3", kind = "u32", value = 300 }]

[[command]]
id = "timers"
msg = "0041"
label = "Read timers"
input = "none"

[[command]]
id = "ac_switch"
msg = "004a"
label = "AC Output"
group = "control"
input = "switch"
param = { kind = "u8" }
state = "ac_switch"

[[command]]
id = "dc_switch"
msg = "004b"
label = "Car Charger Output"
group = "control"
input = "switch"
param = { kind = "u8" }
state = "dc_switch"

[[command]]
id = "ac_timer"
msg = "0042"
label = "AC Output Timer"
group = "control"
input = "number"
param = { kind = "u32" }
min = 0
max = 86100
step = 300
unit = "s"
state = "ac_timer_remaining"

[[command]]
id = "dc_timer"
msg = "0043"
label = "Car Charger Timer"
group = "control"
input = "number"
param = { kind = "u32" }
min = 0
max = 86100
step = 300
unit = "s"
state = "dc_timer_remaining"

[[command]]
id = "light_mode"
msg = "004f"
label = "Brightness"
group = "control"
input = "choice"
param = { kind = "u8" }
options = [
  { value = 0, label = "Off" },
  { value = 1, label = "Low" },
  { value = 2, label = "Mid" },
  { value = 3, label = "High" },
]
state = "light_mode"

[[command]]
id = "screen_switch"
msg = "0052"
label = "Screen"
group = "control"
input = "switch"
param = { kind = "u8" }
state = "screen_on"

[[command]]
id = "ac_charge_power"
msg = "0044"
label = "AC Recharging Power"
group = "function"
input = "choice"
param = { kind = "u16" }
options = [
  { value = 100, label = "100W" },
  { value = 200, label = "200W" },
  { value = 300, label = "300W" },
  { value = 330, label = "330W" },
]
unit = "W"
state = "ac_charge_power"

[[command]]
id = "ac_frequency"
msg = "004d"
label = "AC Output Frequency"
group = "function"
input = "choice"
param = { kind = "u8" }
options = [{ value = 50, label = "50Hz" }, { value = 60, label = "60Hz" }]
state = "ac_frequency"
danger = "confirm"
danger_text = "Changing the AC frequency affects every appliance on the AC output. Only change it if your appliances need it."
requires = [{ field = "ac_switch", eq = 0, reason = "Turn off the AC output." }]

[[command]]
id = "device_timeout"
msg = "0045"
label = "Device Timeout"
group = "function"
input = "choice"
param = { kind = "u16" }
options = [
  { value = 30, label = "30mins" },
  { value = 60, label = "1Hr" },
  { value = 120, label = "2Hr" },
  { value = 240, label = "4Hr" },
  { value = 360, label = "6Hr" },
  { value = 720, label = "12Hr" },
  { value = 1440, label = "24Hr" },
  { value = 0, label = "Never" },
]
state = "device_timeout"
tip = "If the device is not being charged or discharged, it will enter sleep mode and shut down after a set time. To exit sleep mode: 1. Charge or discharge the device; 2. Press the device button; 3. Use Xilo."

[[command]]
id = "car_saving_mode"
msg = "0076"
label = "Car Charger Output Power Saving Mode"
group = "function"
input = "switch"
param = { kind = "u8" }
state = "car_saving_mode"
on_state = 2
visible_if = [{ field = "car_saving_mode", ne = 0 }]
tip = "When the car charger output detects power below 3W for 5 consecutive hours, car charging automatically stops."

[[command]]
id = "ac_smart_mode"
msg = "0077"
label = "Smart AC Output Mode"
group = "function"
input = "switch"
param = { kind = "u8" }
state = "ac_smart_mode"
on_state = 2
visible_if = [{ field = "ac_smart_mode", ne = 0 }]
tip = "When the function is turned on, if no electrical appliances are plugged into the AC output port, the AC output will automatically turn off after 15 minutes in order to save power."

[[command]]
id = "sos"
msg = "004f"
label = "Light SOS Mode"
group = "function"
input = "switch"
param = { kind = "u8" }
state = "light_mode"
on_value = 4
off_value = 0
on_state = 4

[[command]]
id = "screen_brightness"
msg = "004c"
label = "Screen Brightness"
group = "function"
input = "choice"
param = { kind = "u8" }
options = [
  { value = 1, label = "Low" },
  { value = 2, label = "Mid" },
  { value = 3, label = "High" },
]
state = "screen_brightness"

[[command]]
id = "screen_timeout"
msg = "0046"
label = "Screen Timeout"
group = "function"
input = "choice"
param = { kind = "u16" }
options = [
  { value = 20, label = "20s" },
  { value = 30, label = "30s" },
  { value = 60, label = "1min" },
  { value = 300, label = "5mins" },
  { value = 1800, label = "30mins" },
]
state = "screen_timeout"

[[command]]
id = "port_memory"
msg = "0079"
label = "Output Port Memory Switch"
group = "function"
input = "switch"
param = { kind = "u8" }
state = "port_memory"
visible_if = [{ field = "port_memory_visible", eq = 1 }]
tip = "If the AC output or car charger output is on and closes because the battery drops below the discharge limit, it reopens automatically when the battery recovers to the discharge limit plus 10%."

[[command]]
id = "temperature_unit"
msg = "0050"
label = "Temperature"
group = "general"
input = "choice"
param = { kind = "u8" }
options = [{ value = 0, label = "℃" }, { value = 1, label = "℉" }]
state = "temperature_unit"

[[command]]
id = "factory_reset"
msg = "0051"
label = "Restore Default Settings"
group = "general"
input = "none"
danger = "destructive"
danger_text = "The device will be restored to factory settings."

