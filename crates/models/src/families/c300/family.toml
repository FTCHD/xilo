[family]
id = "c300"
protocol = "zx"
gatt = "g1"
state_msgs = ["0840", "0405", "0402"]
status_request = "status"
keepalive = { command = "live_reporting", every_s = 60, skip_if = "upgrading" }
poll = { command = "status", every_s = 60, skip_if = "upgrading" }
dashboard = "c300"

