[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
xilo-proto = { path = "crates/proto" }
xilo-models = { path = "crates/models" }
xilo-engine = { path = "crates/engine" }

gpui-kit = "=0.11.0"

p256 = { version = "0.14", features = ["ecdh"] }
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
aes-gcm = "0.11.1"
thiserror = "2"
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1.92"
getrandom = "0.4.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
