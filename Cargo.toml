[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
homepage = "https://ftchd.github.io/xilo"
repository = "https://github.com/ftchd/xilo"
publish = false

[workspace.dependencies]
xilo-proto = { path = "crates/proto" }
xilo-models = { path = "crates/models" }
xilo-engine = { path = "crates/engine" }
xilo-ble = { path = "crates/ble" }
xilo-store = { path = "crates/store" }

gpui-kit = "=0.11.0"
gpui-tray = { version = "=0.3.0", default-features = false, features = ["gpui-kit"] }

p256 = { version = "0.14", features = ["ecdh"] }
aes = "0.9.4"
cbc = { version = "0.2.1", features = ["alloc"] }
aes-gcm = "0.11.1"
thiserror = "2"
hex = "0.4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
indexmap = { version = "2", features = ["serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1.92"
getrandom = "0.4.3"
btleplug = "=0.13.5"
futures = "0.3"
uuid = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
directories = "6"
serde_json = "1"
jiff = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
rust-embed = { version = "8", features = ["include-exclude"] }
windows-registry = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
