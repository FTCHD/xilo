name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Pull requests stop their old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-15
          - name: linux
            runner: ubuntu-22.04
          - name: windows
            runner: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The same packages as the release builds.
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libdbus-1-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libvulkan-dev

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # These checks give the same result on every system, so Linux runs them.
      - if: matrix.name == 'linux'
        run: cargo fmt --all --check
      - if: matrix.name == 'linux'
        run: cargo run -p xtask -- check-public
      - if: matrix.name == 'linux'
        run: cargo run -p xtask -- site --check
      - if: matrix.name == 'macos'
        run: cargo build -p xilo --release
